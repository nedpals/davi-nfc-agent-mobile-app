apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.agentpinning'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "expo.modules.agentpinning"
  defaultConfig {
    minSdkVersion 24
  }
  compileSdk 35

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  // WebSocketModule.setCustomClientBuilder and OkHttp both come from the host
  // app's React Native, so neither is declared as a version here.
  implementation 'com.facebook.react:react-android'
}
